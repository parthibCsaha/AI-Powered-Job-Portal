# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT config for tests
jwt.secret=test-secret-key-that-is-at-least-32-characters-long-for-hs256
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Mail disabled for tests
app.mail.from=test@jobportal.com
app.mail.enabled=false
spring.mail.host=localhost
spring.mail.port=25

# AI disabled for tests
app.ai.groq.api-key=
app.ai.groq.model=test-model

# File upload
file.upload-dir=uploads-test
